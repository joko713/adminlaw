<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Admin Law Study">
  <!-- Background: editorial deep blue (matches --margin-blue) with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#1f3559"/>
  <!-- Subtle top highlight for a 'card' feel -->
  <rect x="2" y="2" width="60" height="26" rx="12" fill="url(#hi)" opacity="0.16"/>

  <!-- Scales of justice — pure paths, no font dependency -->
  <g fill="none" stroke="#fafaf7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top finial knob -->
    <circle cx="32" cy="13" r="2.4" fill="#fafaf7" stroke="none"/>
    <!-- Vertical post -->
    <line x1="32" y1="15.4" x2="32" y2="48" stroke-width="2.8"/>
    <!-- Horizontal beam -->
    <line x1="11" y1="22" x2="53" y2="22" stroke-width="2.6"/>
    <!-- Left chains -->
    <line x1="15" y1="22" x2="12" y2="30" stroke-width="1.3"/>
    <line x1="15" y1="22" x2="18" y2="30" stroke-width="1.3"/>
    <!-- Left pan (bowl) -->
    <path d="M 8 30 Q 15 38 22 30" stroke-width="2" fill="rgba(250,250,247,0.22)"/>
    <!-- Right chains -->
    <line x1="49" y1="22" x2="46" y2="30" stroke-width="1.3"/>
    <line x1="49" y1="22" x2="52" y2="30" stroke-width="1.3"/>
    <!-- Right pan (bowl) -->
    <path d="M 42 30 Q 49 38 56 30" stroke-width="2" fill="rgba(250,250,247,0.22)"/>
    <!-- Base plate -->
    <rect x="22" y="48" width="20" height="3.4" rx="1.4" fill="#fafaf7" stroke="none"/>
    <!-- Base feet -->
    <line x1="26" y1="52.5" x2="38" y2="52.5" stroke-width="2"/>
  </g>

  <defs>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
